<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secure-GPT Study</title>
<style>
  :root { --ink: #1c2430; --muted: #5b6574; --line: #d6dbe3; --brand: #0d47a1; --bg: #f5f7fa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { background: var(--brand); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  #progress { font-size: 14px; opacity: .9; }
  main { max-width: 760px; margin: 28px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; }
  h2 { margin: 0 0 12px; font-size: 22px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  label.inline { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  input[type=number], select { font-size: 16px; padding: 7px 10px; border: 1px solid #aab3c0; border-radius: 6px; }
  textarea.material { width: 100%; min-height: 170px; font: 14px/1.45 Consolas, "Courier New", monospace; padding: 12px; border: 1px solid #aab3c0; border-radius: 8px; background: #fbfcfe; resize: vertical; }
  textarea.comment { width: 100%; min-height: 90px; font: inherit; padding: 8px; border: 1px solid #aab3c0; border-radius: 8px; }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button { font: 600 15px "Segoe UI", sans-serif; padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer; background: var(--brand); color: #fff; }
  button.secondary { background: #e3e8ef; color: var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .scenario { font-size: 17px; font-weight: 600; margin: 4px 0 14px; }
  .steps { background: #eef3fb; border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-top: 14px; }
  table.likert { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  table.likert th { font-weight: 600; color: var(--muted); font-size: 12px; text-align: center; padding: 4px; }
  table.likert td { border-top: 1px solid var(--line); padding: 8px 4px; }
  table.likert td.q { width: 52%; }
  table.likert td.o { text-align: center; }
  .err { color: #c62828; font-size: 14px; min-height: 20px; }
  .ok { color: #2e7d32; }
  .face { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<header><h1>🛡️ Secure-GPT study</h1><div id="progress"></div></header>
<main><div class="card" id="view">Loading…</div></main>
<script src="study.js"></script>
</body>
</html>
